{% extends "base.html" %}

{% block title %}Login | HF Markets{% endblock %}

{% block content %}
  <h1>Login</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Login</button>
  </form>
  <p>New here? <a href="{% url 'accounts:signup' %}">Register</a></p>
{% endblock %}
