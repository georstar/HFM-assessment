{% extends "base.html" %}
{% load static %}

{% block title %}Register | HF Markets{% endblock %}

{% block content %}
  <h1>Register</h1>
  <form id="signup-form" method="post" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Join now</button>
  </form>
  <p>Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
{% endblock %}

{% block scripts %}
  {{ signup_config|json_script:"signup-config" }}
  <script src="{% static 'js/signup.js' %}" defer></script>
{% endblock %}
