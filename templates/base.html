{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HF Markets{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto+Condensed:wght@700&display=swap">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="{% url 'accounts:signup' %}">
        <span class="brand__tagline">Member of HF Markets Group</span>
        <img src="{% static 'img/logo.svg' %}" alt="HFM - HF Markets" width="119" height="58">
      </a>
      {% block header_action %}{% endblock %}
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'js/password-toggle.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
